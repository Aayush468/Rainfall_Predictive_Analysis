[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rainfall-predictive-project"
version = "0.1.0"
description = "Indian rainfall data ingestion, analytics, and prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "pandas>=2.2",
  "numpy>=1.26",
  "SQLAlchemy>=2.0",
  "psycopg[binary]>=3.1",
  "scikit-learn>=1.4",
  "xgboost>=3.2",
  "joblib>=1.3",
  "streamlit>=1.50",
  "plotly>=5.22",
  "python-dotenv>=1.0",
  "xarray>=2024.3",
  "netCDF4>=1.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "python-docx>=1.1"]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
include = ["src*"]

[project.scripts]
rainfall-ingest = "src.ingestion.run_pipeline:main"
rainfall-train = "src.ml.train:main"
rainfall-predict = "src.ml.predict:main"

